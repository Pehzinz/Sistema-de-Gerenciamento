spring.application.name=sistema-gestao

# ---- Servidor ----
# O Railway define a porta pela variável PORT. Localmente (sem PORT) usa 8080.
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
# Atrás do proxy do Railway: respeita os cabeçalhos X-Forwarded-* (HTTPS e IP real)
server.forward-headers-strategy=framework

# ---- Segredo do JWT (variável JWT_SECRET no Railway) ----
api.security.token.secret=${JWT_SECRET}

# ---- Banco de dados (Supabase - Session Pooler) ----
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Plano gratuito do Supabase tem poucas conexões: pool pequeno
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=1500000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# O bot só deve ser habilitado depois de configurar chat privado e empresa autorizados.
telegrambots.enabled=${TELEGRAM_ENABLED:false}

# BOT_TOKEN (Telegram) e CORS_ALLOWED_ORIGINS são lidos direto das variáveis do Railway.
